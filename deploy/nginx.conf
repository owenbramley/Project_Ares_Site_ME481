# Served behind Cloudflare tunnel -> edge nginx -> Traefik (which compresses).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # HTML always revalidates so a new release shows at once.
  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }

  # CSS/JS revalidate too (file names are not hashed); pictures and video cache for a week.
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache" always; }
  location /assets/ { add_header Cache-Control "public, max-age=604800" always; }

  location / { try_files $uri $uri/ =404; }
}
